<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Projektet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: projektnät (areor som expanderar till underareor, delning bara på underareor) med inspektör till höger, tidplan med låst röd baslinje och flytande röd tråd */
:root{
  --bg:#EDEFF2; --surface:#F6F7F9; --panel:#FFFFFF; --ink:#16212B; --ink-2:#4A5865; --line:#C9D0D8; --faint:#E1E5EA;
  --accent:#1D3F6E; --accent-ink:#FFFFFF; --red:#D4261C; --red-soft:#F7D9D6; --warn:#D99100; --ok:#2E7D5B;
  --c-pl:#16212B; --c-best:#6D4C9F; --c-kons:#17758F; --c-entr:#3F5FA8; --c-ue:#3E7B4B; --c-lev:#8C5A3C; --c-myn:#5A6670;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A; --surface:#131B23; --panel:#18222C; --ink:#E6EBF0; --ink-2:#9BA9B6; --line:#2C3946; --faint:#1E2832;
    --accent:#7FA8E0; --accent-ink:#0E141A; --red:#FF5A4D; --red-soft:#3A1B19; --warn:#F2B230; --ok:#5CC49A;
    --c-pl:#E6EBF0; --c-best:#B79BE0; --c-kons:#5BC0DC; --c-entr:#8CA8F0; --c-ue:#7FCB8C; --c-lev:#D6A27F; --c-myn:#9AA6B0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#131B23; --panel:#18222C; --ink:#E6EBF0; --ink-2:#9BA9B6; --line:#2C3946; --faint:#1E2832;
  --accent:#7FA8E0; --accent-ink:#0E141A; --red:#FF5A4D; --red-soft:#3A1B19; --warn:#F2B230; --ok:#5CC49A;
  --c-pl:#E6EBF0; --c-best:#B79BE0; --c-kons:#5BC0DC; --c-entr:#8CA8F0; --c-ue:#7FCB8C; --c-lev:#D6A27F; --c-myn:#9AA6B0;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);display:flex;flex-direction:column;padding-inline:0;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-2)}
.k-pl{--k:var(--c-pl)}.k-best{--k:var(--c-best)}.k-kons{--k:var(--c-kons)}.k-entr{--k:var(--c-entr)}.k-ue{--k:var(--c-ue)}.k-lev{--k:var(--c-lev)}.k-myn{--k:var(--c-myn)}

/* Topbar */
.bar{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.01em}
.brand svg{display:block}
.projname{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 200px}
.projname input{background:transparent;border:1px solid transparent;padding:4px 6px;font-weight:600;font-size:15px;min-width:0;width:100%;max-width:300px;border-radius:2px}
.projname input:hover:not(:disabled),.projname input:focus{border-color:var(--line);background:var(--panel)}
.badge{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:2px 6px;color:var(--ink-2);white-space:nowrap}
.tabs{display:flex;gap:2px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 12px;color:var(--ink-2);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs button[hidden]{display:none}
.as{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.as select{padding:5px 8px;border:1px solid var(--line);background:var(--panel);border-radius:2px;max-width:180px;font-weight:600;color:var(--ink)}
.actions{display:flex;gap:8px;margin-left:auto}
.btn{background:var(--panel);border:1px solid var(--line);padding:6px 11px;border-radius:2px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12.5px}

/* Net view */
main{flex:1;min-height:0;display:flex;flex-direction:column}
#viewNet{flex:1;min-height:0;display:grid;grid-template-columns:176px minmax(0,1fr) 404px}
.palette{border-right:1px solid var(--line);padding:14px;overflow:auto;background:var(--surface)}
.palette h2,.insp h3{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.pal-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 9px;margin-bottom:6px;border:1px solid var(--line);background:var(--panel);cursor:grab;border-radius:2px}
.pal-item:hover{border-color:var(--k)}
.pal-item i{width:10px;height:22px;background:var(--k);flex:none}
.palette p{font-size:12.5px;color:var(--ink-2);margin:12px 0 0}
.canvas-wrap{position:relative;background:var(--surface);min-width:0;min-height:0;overflow:hidden}
#net{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.ring,.spoke{fill:none;stroke:var(--faint);stroke-width:1}
.lnk{fill:none;stroke:var(--ink-2);stroke-opacity:.5}
.lnk.dim{stroke-opacity:.18}
.lnk.on{stroke:var(--accent);stroke-opacity:1}
.lnk.picked{stroke-width:5}
.lnk-hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer;pointer-events:stroke}
.lnk-temp{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;fill:none;pointer-events:none}
.node{cursor:pointer;touch-action:none;transition:opacity .15s}
.node.dim,.subnode.dim{opacity:.38}
.nbox{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.node.pl .nbox{stroke:var(--red);stroke-width:2}
.node.sel .nbox{stroke:var(--accent);stroke-width:3}
.node.open .nbox{stroke-width:2.2}
.nrole{fill:var(--k)}
.nname{font:600 13px var(--f-body);fill:var(--ink)}
.nco{font:400 11.5px var(--f-body);fill:var(--ink-2)}
.expbadge{font:500 10.5px var(--f-mono);fill:var(--ink-2)}
.handle{fill:var(--panel);stroke:var(--accent);stroke-width:2;cursor:crosshair;touch-action:none}
.subnode{cursor:pointer;touch-action:none}
.sbox{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.subnode.sel .sbox{stroke:var(--accent);stroke-width:2.8}
.srole{fill:var(--k)}
.sname{font:500 12px var(--f-body);fill:var(--ink)}
.ssub{font:400 10px var(--f-mono);fill:var(--ink-2)}
.ghost{cursor:pointer}
.gbox{fill:none;stroke:var(--ink-2);stroke-dasharray:4 3}
.ghost:hover .gbox{stroke:var(--accent)}
.gtx{font:500 12px var(--f-body);fill:var(--ink-2)}
.subthread{stroke:var(--k);stroke-width:2;stroke-opacity:.7;fill:none}
.sharethread{stroke:var(--accent);stroke-width:1.8;stroke-dasharray:5 4;fill:none}
.linkbar{position:absolute;left:12px;top:12px;max-width:min(520px,calc(100% - 24px));display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);padding:8px 12px;font-size:12.5px}
.canvas-note{position:absolute;left:12px;bottom:10px;font:400 11.5px var(--f-mono);color:var(--ink-2);max-width:62%;pointer-events:none}

/* Inspector */
.insp{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;min-width:0}
.insp-head{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.insp-head input{border:1px solid transparent;background:transparent;padding:3px 6px;margin-left:-6px;border-radius:2px;min-width:0}
.insp-head input:hover,.insp-head input:focus{border-color:var(--line);background:var(--surface)}
.insp-head .ro{font:900 20px var(--f-display)}
.insp-head .ro2{color:var(--ink-2)}
#aName,#sName{font:900 20px var(--f-display)}
#aCo{color:var(--ink-2)}
.roletag{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.roletag i{width:10px;height:10px;background:var(--k)}
.linked{margin-bottom:14px;font-size:12.5px;color:var(--ink-2)}
.seg{display:flex;border:1px solid var(--line);margin-bottom:14px}
.seg button{flex:1;background:var(--surface);border:0;padding:7px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.sec-h h3{margin:0}
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
.trow{display:flex;align-items:center;gap:5px;padding:3px 0 3px calc(var(--d)*16px);border-bottom:1px solid var(--faint);min-height:30px}
.caret{width:18px;border:0;background:none;color:var(--ink-2);padding:0;flex:none;text-align:center}
.caret.sp{display:inline-block}
.ico{flex:none;display:inline-block}
.ico.folder{width:15px;height:11px;border:1.5px solid var(--ink-2);border-top-width:3px}
.ico.file{width:11px;height:14px;border:1.5px solid var(--ink-2);margin:0 2px}
.nm{border:0;background:none;text-align:left;padding:1px 2px;min-width:0;overflow-wrap:anywhere;flex:1}
.nm:hover{text-decoration:underline}
.sharebadge{font:500 10.5px var(--f-mono);color:var(--accent);border:1px solid var(--accent);padding:0 5px;white-space:nowrap}
.acts{display:flex;gap:2px;flex:none}
.acts button{border:0;background:none;color:var(--ink-2);font-size:12px;padding:2px 5px}
.acts button:hover{color:var(--ink);background:var(--faint)}
.tg{display:inline-block;margin:4px 6px 0 0;padding:3px 9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.filebody{margin:2px 0 6px calc(var(--d)*16px + 26px);padding:7px 10px;background:var(--surface);border-left:3px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.addrow{display:flex;gap:6px;padding:6px 0 6px calc(var(--d)*16px + 18px)}
.addrow input{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--accent);background:var(--panel);border-radius:2px}
.foreign h4{margin:12px 0 4px;font:600 12.5px var(--f-body);display:flex;align-items:center;gap:8px}
.foreign h4 i{width:8px;height:14px;background:var(--k)}
.foreign h5{margin:8px 0 2px;font:500 11.5px var(--f-mono);color:var(--ink-2);letter-spacing:.04em}
.subrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--faint)}
.subrow .sw{width:8px;height:16px;background:var(--k);flex:none}
.subrow .who{font-size:12px;color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-2);margin:6px 0}
.empty{padding:10px 12px;border:1px dashed var(--line);color:var(--ink-2);font-size:13px}
.steps{padding-left:18px;margin:8px 0 16px}
.steps li{margin-bottom:8px}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--faint);display:flex;gap:8px;flex-wrap:wrap}
.back{margin-bottom:10px}

/* Decision log */
.dform{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px}
.dform input,.dform textarea{padding:7px 9px;border:1px solid var(--line);background:var(--surface);border-radius:2px;min-width:0;width:100%}
.dform textarea{min-height:70px;resize:vertical}
.derr{color:var(--red);font-size:12.5px}
.dec{border-left:3px solid var(--ink);padding:2px 0 2px 10px;margin-bottom:12px}
.dec-ts{font:500 11.5px var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.dec b{display:block;margin:1px 0}
.dec .by{font-size:12px;color:var(--ink-2);margin-top:2px}

/* AI */
.ai-q{width:100%;min-height:64px;padding:8px 10px;border:1px solid var(--line);background:var(--surface);resize:vertical;border-radius:2px}
.ai-row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ex button{border:1px solid var(--line);background:var(--panel);padding:3px 9px;font-size:12.5px;border-radius:99px}
.ex button:hover{border-color:var(--accent)}
.ai-q-bub{margin:10px 0;padding:6px 10px;background:var(--surface);border:1px solid var(--faint)}
.ai-ans{white-space:pre-wrap}
.ai-out{margin-top:12px;border-top:1px solid var(--faint);padding-top:10px}
.ai-src{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin-bottom:10px}
.ai-meta{font:400 11.5px var(--f-mono);color:var(--ink-2);margin-top:3px}
.ai-out.none b{color:var(--red)}
.preview{font:400 11.5px var(--f-mono);color:var(--ink-2);border:1px solid var(--line);padding:6px 8px;margin-bottom:10px;background:var(--surface)}

/* New project sheet */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px;z-index:20;overflow:auto}
.sheet[hidden]{display:none}
.sheet form{background:var(--panel);border:1px solid var(--line);padding:20px;width:100%;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.sheet h2{font:900 20px var(--f-display);margin:0 0 4px}
.sheet label{display:block;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.sheet input:not([type=checkbox]),.sheet select{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:2px}
.sheet label.chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink)}
.sheet label.chk input{margin-top:3px}
.sheet .hint{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.sheet .row{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}

/* Plan view */
#viewPlan{flex:1;min-height:0;overflow:auto;padding:16px}
.pt{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:10px}
.pt-stats{display:flex;flex-wrap:wrap;gap:10px 28px;flex:1 1 400px}
.pt-stats div{display:flex;flex-direction:column;gap:1px}
.pt-stats .k{font:500 10.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.pt-stats b{font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.pt-stats b.late{color:var(--red)}
.pt-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pnote{flex-basis:100%;font-size:12.5px;color:var(--ink-2);border-left:3px solid var(--warn);padding:2px 0 2px 10px}
.planmsg{min-height:20px;font-size:12.5px;color:var(--red);margin-bottom:6px}
.gantt{display:grid;grid-template-columns:minmax(130px,236px) minmax(0,1fr);border:1px solid var(--line);background:var(--panel)}
.g-left{border-right:1px solid var(--line);padding-top:58px}
.g-left .lrow{display:flex;align-items:center;gap:8px;width:100%;padding:0 10px;border:0;border-bottom:1px solid var(--faint);overflow:hidden;background:none;text-align:left}
.lrow.rail{font:700 13px var(--f-display);color:var(--red)}
.g-left .lrow.rail2{flex-direction:column;align-items:stretch;padding:0;gap:0}
.rl{height:35px;display:flex;align-items:center;gap:8px;padding:0 10px;font:700 12px var(--f-display);color:var(--red);flex:none}
.rl small{font:400 10.5px var(--f-mono);color:var(--ink-2)}
.lrow.lane{background:var(--faint);font:600 12px var(--f-body)}
.lrow.lane small{color:var(--ink-2);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.lane .kdot{width:8px;height:14px;background:var(--k);flex:none}
.lrow.task{flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.lrow.task.sel{background:var(--faint)}
.lrow .tn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:6px}
.lrow .tm{font:400 11px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.lrow .tm .late{color:var(--red);font-weight:500}
.tick{width:3px;height:13px;background:var(--red);flex:none}
.andon-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.g-scroll{overflow-x:auto;min-width:0}
#gantt{display:block}
.g-wk{font:500 11px var(--f-mono);fill:var(--ink)}
.g-dt{font:400 10px var(--f-mono);fill:var(--ink-2)}
.g-mo{font:700 11px var(--f-display);fill:var(--ink-2);letter-spacing:.04em}
.g-grid{stroke:var(--faint);stroke-width:1}
.g-lane{fill:var(--faint)}
.g-rowline{stroke:var(--faint);stroke-width:1}
.g-today{stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:4 4}
.g-todaytx{font:600 10.5px var(--f-mono);fill:var(--ink)}
.g-track{fill:var(--k);fill-opacity:.22}
.g-prog{fill:var(--k)}
.g-base{stroke:var(--red);stroke-width:2;stroke-linecap:round;opacity:.85}
.g-bar.main .g-track{stroke:var(--red);stroke-width:2}
.g-bar.sel .g-track{stroke:var(--accent);stroke-width:3}
.g-bar.main.sel .g-track{stroke:var(--red);stroke-width:3.5}
.g-move{fill:transparent;cursor:grab;touch-action:none}
.g-rz{fill:var(--ink);fill-opacity:0;cursor:ew-resize;touch-action:none}
.g-bar:hover .g-rz{fill-opacity:.35}
.g-handle{fill:var(--panel);stroke:var(--accent);stroke-width:2;opacity:0;cursor:crosshair;touch-action:none}
.g-bar:hover .g-handle,.g-bar.sel .g-handle{opacity:1}
.g-pct{font:400 11px var(--f-mono);fill:var(--ink-2)}
.g-thread-a{fill:none;stroke:var(--k);stroke-width:3.4;stroke-linecap:round}
.g-thread-b{fill:none;stroke:var(--panel);stroke-width:1.1;stroke-dasharray:2 4;stroke-linecap:round;opacity:.75;pointer-events:none}
.g-thread.red .g-thread-a{stroke:var(--red)}
.g-knot{fill:var(--k)}
.g-thread.red .g-knot{fill:var(--red)}
.g-thread-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
.g-thread-temp{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-dasharray:5 4;pointer-events:none}
.g-rail{stroke:var(--red);stroke-width:5;stroke-linecap:round}
.g-float-a{fill:none;stroke:var(--red);stroke-width:4.4;stroke-linecap:round}
.g-float-b{fill:none;stroke:var(--panel);stroke-width:1.1;stroke-dasharray:2 4;stroke-linecap:round;opacity:.8}
.g-ms{fill:var(--red)}
.g-ms-f{fill:var(--panel);stroke:var(--red);stroke-width:2.5}
.g-slip{stroke:var(--warn);stroke-width:1.6;stroke-dasharray:3 3}
.g-mstx{font:400 10.5px var(--f-body);fill:var(--ink-2)}
.g-gaptx{font:600 11px var(--f-mono);fill:var(--ink)}
.g-ma{stroke:var(--ink-2);stroke-width:1;stroke-opacity:.55}
.g-ma-box{fill:none;stroke:var(--ink-2);stroke-opacity:.45;stroke-dasharray:3 3}
.g-matx{font:500 11px var(--f-display);fill:var(--ink-2)}
.g-andon{fill:var(--warn);stroke:var(--panel);stroke-width:1.5}
.g-andon-ring{fill:none;stroke:var(--warn);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.g-andon-ring{animation:none;opacity:.5}.node{transition:none}}
.g-ne-open{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.g-ne-done{fill:var(--ok);stroke:var(--panel);stroke-width:1.5}
.ed{margin-top:14px;border:1px solid var(--line);background:var(--panel);padding:14px}

function edgeList(){
  const m={},out=[];
  P.subs.forEach(s=>s.shared.forEach(t=>{
    if(!area(t)||!area(s.parent)||t===s.parent||t===P.plId)return;
    const key=[s.parent,t].sort().join('|');
    if(!m[key]){m[key]={key,a:key.split('|')[0],b:key.split('|')[1],items:[]};out.push(m[key])}
    m[key].items.push({sub:s,from:s.parent,to:t});
  }));
  return out;
}

const net=$('#net');
function svgPt(e){
  const pt=net.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  return pt.matrixTransform(net.getScreenCTM().inverse());

function subLayout(a,others){
  const vis=subs(a.id).filter(s=>subVisible(s,UI.as));
  const items=vis.map(s=>({sub:s}));
  if(canEditArea(a.id))items.push({ghost:true});
  const n=items.length,pl=area(P.plId),full=a.id===P.plId;
  const base=full?-Math.PI/2:Math.atan2(a.y-pl.y,a.x-pl.x);
  const span=full?Math.PI*2:Math.min(Math.PI*1.75,Math.max(Math.PI*0.6,n*0.7));
  const R=n>6?195:150;
  items.forEach((it,k)=>{
    const ang=full?base+k*2*Math.PI/n:(n===1?base:base-span/2+span*k/(n-1));
    it.x=a.x+Math.cos(ang)*R*1.2;
    it.y=a.y+Math.sin(ang)*R;
  });
  /* Push sub-areas away from every area box, from earlier expanded fans and from each other. */
  const HW=72,HH=21,GAP=10;
  const boxes=P.areas.map(o=>{const z=nodeSize(o);return {x:o.x,y:o.y,hw:z.w/2,hh:z.h/2}});
  (others||[]).forEach(it=>boxes.push({x:it.x,y:it.y,hw:HW,hh:HH}));
  for(let iter=0;iter<80;iter++){
    let moved=false;
    items.forEach(p=>{
      boxes.forEach(r=>{
        const dx=p.x-r.x,dy=p.y-r.y,ox=r.hw+HW+GAP-Math.abs(dx),oy=r.hh+HH+GAP-Math.abs(dy);
        if(ox>0&&oy>0){if(ox<oy)p.x+=(dx<0?-1:1)*ox;else p.y+=(dy<0?-1:1)*oy;moved=true}
      });
      items.forEach(q=>{
        if(q===p)return;
        const dx=p.x-q.x,dy=p.y-q.y,ox=HW*2+GAP-Math.abs(dx),oy=HH*2+GAP-Math.abs(dy);
        if(ox>0&&oy>0){
          if(ox<oy){const m=(dx<0?-1:1)*ox/2;p.x+=m;q.x-=m}else{const m=(dy<0?-1:1)*oy/2;p.y+=m;q.y-=m}
          moved=true;
        }
      });
    });
    if(!moved)break;
  }
  return items;
}

  if(up)return {t:up,ps:PR[up.id].ps,pe:PR[up.id].pe,ongoing:false};
  const on=ts.sort((a,b)=>a.start-b.start)[0];
  return on?{t:on,ps:on.start,pe:PR[on.id].pe,ongoing:true}:null;
}

  P.areas.forEach(a=>{

  exp.forEach(id=>{

/* ---------- Zoom and pan ---------- */
function applyVB(){net.setAttribute('viewBox',VB.x.toFixed(1)+' '+VB.y.toFixed(1)+' '+VB.w.toFixed(1)+' '+VB.h.toFixed(1))}
function contentBox(onlySubs){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const add=(x,y,hw,hh)=>{x0=Math.min(x0,x-hw);x1=Math.max(x1,x+hw);y0=Math.min(y0,y-hh);y1=Math.max(y1,y+hh)};
  if(!onlySubs)P.areas.forEach(a=>{const z=nodeSize(a);add(a.x,a.y,z.w/2+12,z.h/2+12)});
  Object.keys(LAY).forEach(id=>LAY[id].forEach(it=>add(it.x,it.y,84,33)));
  return x0>x1?null:{x0,y0,x1,y1};
}
function fitView(){
  const r=net.getBoundingClientRect();
  if(!r.width||!r.height){VB.needFit=true;return}
  const b=contentBox();if(!b)return;
  const bw=Math.max(b.x1-b.x0,260),bh=Math.max(b.y1-b.y0,200);
  const sc=Math.max(0.2,Math.min((r.width-60)/bw,(r.height-200)/bh,1.6));
  VB.w=r.width/sc;VB.h=r.height/sc;
  VB.x=(b.x0+b.x1)/2-VB.w/2;
  VB.y=b.y0-100/sc;
  VB.needFit=false;VB.user=false;applyVB();
}
function zoomAt(f,cx,cy){
  const r=net.getBoundingClientRect();if(!r.width)return;
  const cur=r.width/VB.w,nxt=Math.max(0.2,Math.min(3.5,cur*f)),k=nxt/cur;
  if(Math.abs(k-1)<1e-4)return;
  const p=svgPt({clientX:cx==null?r.left+r.width/2:cx,clientY:cy==null?r.top+r.height/2:cy});
  VB.x=p.x-(p.x-VB.x)/k;VB.y=p.y-(p.y-VB.y)/k;VB.w/=k;VB.h/=k;VB.user=true;applyVB();
}
function ensureVisible(){
  const b=contentBox(true);if(!b)return;
  const m=24;
  if(b.x0<VB.x+m||b.x1>VB.x+VB.w-m||b.y0<VB.y+90||b.y1>VB.y+VB.h-90)fitView();
}
net.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.012:0.0016)),e.clientX,e.clientY);
},{passive:false});
const PTR=new Map();
function startPan(e){
  PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const st={moved:false,d0:0};
  net.classList.add('panning');
  const mv=ev=>{
    const q=PTR.get(ev.pointerId);if(!q)return;
    const r=net.getBoundingClientRect(),k=VB.w/r.width;
    if(PTR.size>=2){
      const ids=[...PTR.keys()],a=PTR.get(ids[0]),b=PTR.get(ids[1]);
      const d0=Math.hypot(a.x-b.x,a.y-b.y);
      q.x=ev.clientX;q.y=ev.clientY;
      const a2=PTR.get(ids[0]),b2=PTR.get(ids[1]),d1=Math.hypot(a2.x-b2.x,a2.y-b2.y);
      if(d0>0&&d1>0)zoomAt(d1/d0,(a2.x+b2.x)/2,(a2.y+b2.y)/2);
      st.moved=true;return;
    }
    const dx=ev.clientX-q.x,dy=ev.clientY-q.y;
    if(!st.moved&&Math.abs(ev.clientX-e.clientX)+Math.abs(ev.clientY-e.clientY)<5)return;
    st.moved=true;q.x=ev.clientX;q.y=ev.clientY;
    VB.x-=dx*k;VB.y-=dy*k;VB.user=true;applyVB();
  };
  const up=ev=>{
    PTR.delete(ev.pointerId);
    if(PTR.size)return;
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    net.classList.remove('panning');
    if(!st.moved){UI.sel=null;UI.selLink=null;UI.netMsg='';renderNet();renderInspector()}
  };
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function tidyAreas(){
  if(!isPL())return;
  const pl=area(P.plId),rest=P.areas.filter(a=>a.id!==P.plId);
  const n1=Math.min(rest.length,7),ring=[rest.slice(0,n1),rest.slice(n1)];
  const rad=[[330,235],[540,370]];
  ring.forEach((g,ri)=>g.forEach((a,k)=>{
    const ang=-Math.PI/2+(ri?Math.PI/g.length:0)+k*2*Math.PI/g.length;
    a.x=Math.round(pl.x+Math.cos(ang)*rad[ri][0]);a.y=Math.round(pl.y+Math.sin(ang)*rad[ri][1]);
  }));
  save();renderNet();fitView();
}
function shareAll(srcId,tgtId){
  const src=area(srcId),tgt=area(tgtId);
  if(!src||!tgt||srcId===tgtId||tgtId===P.plId||!canEditArea(srcId))return false;
  const mine=subs(srcId);
  if(!mine.length){UI.netMsg=src.name+' har inga underareor att dela än. Skapa en underarea först.';return false}
  let n=0;mine.forEach(x=>{if(x.shared.indexOf(tgtId)<0){x.shared.push(tgtId);n++}});
  UI.netMsg=n?`Delade alla ${mine.length} underareor i ${src.name} med ${tgt.name}.`:`Alla underareor i ${src.name} var redan delade med ${tgt.name}.`;
  save();return true;
}
function startAreaShare(id){

function nodeDown(id,e){
  const a=area(id),p0=svgPt(e),off={x:a.x-p0.x,y:a.y-p0.y},drag=isPL();
  let moved=false;
  UI.sel=id;UI.selLink=null;UI.netMsg='';UI.confirmDel=false;UI.confirmSub=false;UI.adding=null;UI.aiOut=null;
  if(UI.tab==='log'&&!canEditArea(id))UI.tab='folders';
  renderInspector();renderNet();
  const mv=ev=>{
    if(!drag)return;
    const p=svgPt(ev),nx=clamp(p.x+off.x,-300,1300),ny=clamp(p.y+off.y,-250,1000);
    if(Math.abs(nx-a.x)+Math.abs(ny-a.y)>2)moved=true;
    a.x=nx;a.y=ny;renderNet();
  };
  const up=()=>{
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    if(moved)save();
    else{UI.expanded[id]=!UI.expanded[id];renderNet();if(UI.expanded[id])ensureVisible()}
  };
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function startShare(subId){
  const s=sub(subId);if(!s)return;

net.addEventListener('pointerdown',e=>{
  const ah=e.target.closest('[data-areahandle]');
  if(ah){e.preventDefault();startAreaShare(ah.dataset.areahandle);return}

function freeSpot(){
  const pl=area(P.plId);
  for(const r of [260,340,200]){
    for(let k=0;k<12;k++){
      const g=(k*30+15)*Math.PI/180;
      const x=clamp(pl.x+Math.cos(g)*r*1.25,95,905),y=clamp(pl.y+Math.sin(g)*r*0.85,45,640);
      if(P.areas.every(a=>Math.hypot(a.x-x,a.y-y)>150))return {x,y};
    }
  }
  return {x:150+Math.random()*700,y:80+Math.random()*500};
}
function addArea(type,x,y){
  if(!isPL())return;
  if(x==null){const p=freeSpot();x=p.x;y=p.y}
  const n=P.areas.filter(a=>a.type===type).length;
  const id=type+uid();
  P.areas.push({id,type,name:typeLabel(type)+(n?' '+(n+1):''),company:'',x:clamp(x,95,905),y:clamp(y,45,640)});
  P.folders[id]=BR[P.branch].areaFolders.map(n=>F(n));
  UI.sel=id;UI.selLink=null;UI.tab='folders';UI.aiOut=null;
  save();renderAs();renderNet();renderInspector();
}
function removeArea(id){
  subs(id).forEach(s=>delete P.folders[s.id]);
  P.subs=P.subs.filter(s=>s.parent!==id);
  P.areas=P.areas.filter(a=>a.id!==id);
  delete P.folders[id];delete P.decisions[id];
  P.tasks=P.tasks.filter(t=>t.area!==id);

function addSub(parentId){

/* Threads: a task waits for the tasks in deps. It cannot start before they end. */
function reaches(a,b,seen){
  seen=seen||{};
  if(a===b)return true;
  if(seen[a])return false;seen[a]=true;
  const t=task(a);if(!t)return false;
  return (t.deps||[]).some(p=>reaches(p,b,seen));
}
function enforceDeps(){
  for(let i=0;i<P.tasks.length+2;i++){
    let ch=false;
    P.tasks.forEach(t=>(t.deps||[]).forEach(pid=>{
      const p=task(pid);if(!p)return;
      const min=p.start+p.dur;
      if(t.start<min){t.start=min;ch=true}
    }));
    if(!ch)break;
  }
}
function cleanDeps(){P.tasks.forEach(t=>{t.deps=(t.deps||[]).filter(p=>task(p))})}
function addDep(succId,predId){
  const t=task(succId),p=task(predId);
  if(!t||!p||succId===predId)return false;
  t.deps=t.deps||[];
  if(t.deps.indexOf(predId)>-1)return false;
  if(reaches(predId,succId)){flash('Tråden skulle bilda en ring, där aktiviteterna väntar på varandra. Den spanns inte.');return false}
  t.deps.push(predId);
  enforceDeps();save();
  return true;
}
function lockBaseline(){P.tasks.forEach(t=>{t.bs=t.start;t.bd=t.dur});P.baseline=true;UI.confirmBase=false;save()}

/* Floating projection: where each task will be if nothing is done about it. Unfinished work cannot start or finish in the past, and slips move whatever waits on it. */
function project(tk){
  tk=tk||P.tasks;const tget=id=>tk.find(x=>x.id===id);
  const today=todayOff(),res={};
  const go=t=>{
    if(res[t.id])return res[t.id];
    res[t.id]={ps:t.start,pe:t.start+t.dur};
    if(t.progress>=100)return res[t.id];
    let ps=t.start;
    (t.deps||[]).forEach(pid=>{const p=tget(pid);if(p)ps=Math.max(ps,go(p).pe)});
    let pe;
    if(t.progress>0){ps=t.start;pe=Math.max(t.start+t.dur,today+t.dur*(1-t.progress/100))}
    else{ps=Math.max(ps,today);pe=ps+t.dur}
    res[t.id]={ps,pe};
    return res[t.id];
  };
  tk.forEach(go);
  return res;
}
function mainStats(){
  const main=P.tasks.filter(t=>t.main);
  if(!main.length)return null;
  const proj=project(),t0=todayOff();
  const planEnd=Math.max(...main.map(t=>t.start+t.dur));
  const projEnd=Math.max(...main.map(t=>proj[t.id].pe));
  const bm=P.baseline?main.filter(t=>t.bs!=null):[];
  const hasBase=bm.length>0;
  let baseEnd=null,delay=0,done=false,slip=0,notStarted=false;
  if(hasBase){
    baseEnd=Math.max(...bm.map(t=>t.bs+t.bd));
    const total=bm.reduce((s,t)=>s+t.bd,0);
    const W=bm.reduce((s,t)=>s+t.bd*t.progress/100,0);
    const planned=d=>bm.reduce((s,t)=>s+Math.min(Math.max(d-t.bs,0),t.bd),0);
    const firstStart=Math.min(...bm.map(t=>t.bs));
    done=W>=total-1e-6;
    notStarted=t0<firstStart;
    if(!done&&!notStarted){
      let actual=0;
      for(let d=0;d<=baseEnd;d+=0.1){if(planned(d)>=W-1e-9){actual=d;break}}
      delay=t0-actual;
    }
    slip=projEnd-baseEnd;
  }
  return {main,bm,planEnd,projEnd,baseEnd,hasBase,delay,done,slip,notStarted,proj,today:t0};
}
function wavy(x1,x2,y){
  let d=`M${x1},${y}`,x=x1,k=0;
  while(x<x2-0.5){const nx=Math.min(x+18,x2);d+=` Q${(x+nx)/2},${y+(k%2?3.5:-3.5)} ${nx},${y}`;x=nx;k++}
  return d;
}

      });
      fm.forEach(t=>{const x=st.proj[t.id].pe*px;s+=`<polygon class="g-ms-f" points="${x},${yF-7} ${x+7},${yF} ${x},${yF+7} ${x-7},${yF}"><title>Prognos: ${esc(t.name)} ${fmtD(dateAt(st.proj[t.id].pe))}</title></polygon>`});
      if(Math.abs(st.slip)>0.5)s+=`<text class="g-gaptx" x="${fe+12}" y="${yF+4}">${st.slip>0?'+':''}${Math.round(st.slip)} d</text>`;
    }else{

    if(r.t==='lane')return `<div class="lrow lane k-${r.a.type}" style="height:${r.h}px"><i class="kdot"></i>${esc(r.a.name)} <small>${esc(r.a.company)}</small></div>`;

  const g=$('#gantt');

}

function scheduleChecks(){
  const out=[];if(!P.tasks.length)return out;
  const PR=project(),t0=todayOff(),st=mainStats();
  const bEnd=t=>(P.baseline&&t.bs!=null)?t.bs+t.bd:t.start+t.dur;
  const bStart=t=>(P.baseline&&t.bs!=null)?t.bs:t.start;
  const wf=d=>`v${wk(d)} (${fmtD(dateAt(d))})`;
  if(!P.baseline)out.push({sev:'låg',title:'Baslinjen är inte låst',detail:'Utan låst baslinje finns ingen röd tråd att mäta mot. Lås baslinjen i tidplanen när planen är klar.',tasks:[]});
  if(st&&st.hasBase&&!st.done){
    if(st.slip>=1)out.push({sev:st.slip>=14?'hög':'medel',title:`Röda tråden slutar ${Math.round(st.slip)} dagar efter plan`,detail:`Planerad klar ${wf(st.baseEnd)}, prognos ${wf(st.projEnd)}.`,tasks:[]});
    if(!st.notStarted&&st.delay>=1)out.push({sev:st.delay>=14?'hög':'medel',title:`Utfört arbete ligger ${Math.round(st.delay)} dagar efter röda tråden`,detail:`Enligt baslinjen borde arbetet ha nått dagens läge ${Math.round(st.delay)} dagar tidigare.`,tasks:[]});
  }
  P.tasks.filter(t=>t.progress<100).forEach(t=>{
    const slip=Math.round(PR[t.id].pe-bEnd(t));
    const root=(t.deps||[]).every(pid=>{const p=task(pid);return !p||p.progress>=100||Math.round(PR[p.id].pe-bEnd(p))<1});
    if(bEnd(t)<t0)out.push({sev:t.main?'hög':'medel',title:`${t.name} borde varit klar`,detail:`Planerat slut ${wf(bEnd(t))}, ${t.progress}% klart.`,tasks:[t.id]});
    else if(bStart(t)<t0&&t.progress===0)out.push({sev:t.main?'hög':'medel',title:`${t.name} borde ha startat`,detail:`Planerad start ${wf(bStart(t))}, inget arbete rapporterat.`,tasks:[t.id]});
    else if(slip>=1&&root)out.push({sev:t.main?'medel':'låg',title:`${t.name} slutar ${slip} dagar efter plan`,detail:`Planerat slut ${wf(bEnd(t))}, prognos ${wf(PR[t.id].pe)}.${t.main?' Ligger på röda tråden.':''}`,tasks:[t.id]});
    if(t.andon){const d=descendants(t.id),dm=d.filter(x=>x.main);out.push({sev:(dm.length||t.main)?'hög':'medel',title:`Andon: ${t.name} stoppar arbetet`,detail:`${d.length} aktiviteter väntar direkt eller indirekt på den${dm.length?`, varav ${dm.length} på röda tråden`:''}.`,tasks:[t.id].concat(dm.map(x=>x.id).slice(0,3))})}
    if(t.nema==='open'&&bStart(t)-t0<=21)out.push({sev:'medel',title:`Förankring pågår: ${t.name}`,detail:`Förankringen är inte klar och aktiviteten ${bStart(t)<=t0?'har börjat':'startar '+wf(bStart(t))}.`,tasks:[t.id]});
    if(t.buffer>0&&slip>0)out.push({sev:slip>=t.buffer?'medel':'låg',title:`Bufferten efter ${t.name} används`,detail:`${Math.min(slip,t.buffer)} av ${t.buffer} dagars ma (buffert) är förbrukad. Prognosen ligger ${slip} dagar efter plan.`,tasks:[t.id]});
  });
  const rank={hög:0,medel:1,låg:2};
  return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}

/* ----- Redigering ----- */
function tParse(col,val){
  val=String(val).trim();
  if(val==='')return '';
  if(col.type==='select'){const o=col.opts.find(x=>x.toLowerCase()===val.toLowerCase());return o==null?null:o}
  if(col.type==='part'){const p=T.parts.find(x=>x.id===val||x.name.toLowerCase()===val.toLowerCase());return p?p.id:null}
  if(col.type==='person'){const p=T.users.find(x=>x.id===val||x.name.toLowerCase()===val.toLowerCase());return p?p.id:null}
  if(col.type==='date'){
    if(/^\d{4}-\d{2}-\d{2}$/.test(val))return val;
    const m=val.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
    return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):null;
  }
  return val;
}
function tSetVal(row,col,val){
  const old=row.v[col.key]==null?'':row.v[col.key];
  if(String(old)===String(val))return false;
  const oldT=tText(row,col);
  row.v[col.key]=val;
  tLog(row,'field',{field:col.label,from:oldT,to:tText(row,col)});
  if(col.key==='part'&&row.v.person&&tUser(row.v.person).part!==val){
    const was=tUser(row.v.person).name;row.v.person='';
    tLog(row,'field',{field:'Ansvarig person',from:was,to:''});
  }
  return true;
}
function tNewRow(list,u){
  const n=list.rows.reduce((m,r)=>Math.max(m,parseInt(r.no.split('-')[1],10)||0),0)+1;
  const row={id:uid(),no:list.prefix+'-'+String(n).padStart(3,'0'),status:'open',createdBy:u.id,createdTs:new Date().toISOString(),v:{},att:[]};
  list.cols.forEach(c=>{if(c.type!=='no'&&c.type!=='status')row.v[c.key]=c.def||''});
  if(row.v.part!==undefined&&['proj','el','aut'].indexOf(u.part)>-1)row.v.part=u.part;
  list.rows.push(row);
  tLog(row,'create',{text:'Skapade punkten'});
  return row;
}
function tOpen(id){TU.rowId=id;TU.panel=true;TU.pend=null;tRenderGrid();tRenderDetail()}
function tBeginEdit(r,c,ch){
  const V=TU.view,row=V&&V.rows[r],col=V&&V.list.cols[c],u=tMe();
  if(!row||!col)return;
  if(col.type==='no'||col.type==='status'){tOpen(row.id);return}
  if(!tCanEdit(u,row,col)){tMsg(`${T_ROLES[u.role]} får inte ändra ${col.label.toLowerCase()} på ${row.no} just nu.`);return}
  const grid=$('#trGrid'),td=grid.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
  if(!td)return;
  const cur=row.v[col.key]==null?'':row.v[col.key];
  let ctl;
  if(col.type==='select'||col.type==='part'||col.type==='person'){
    ctl=document.createElement('select');
    let opts=[['','']];
    if(col.type==='select')col.opts.forEach(o=>opts.push([o,o]));
    else if(col.type==='part')T.parts.filter(p=>p.id!=='pl').forEach(p=>opts.push([p.id,p.name]));
    else T.users.filter(x=>x.part===row.v.part).forEach(x=>opts.push([x.id,x.name]));
    ctl.innerHTML=opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1]||'(tom)')}</option>`).join('');
    ctl.value=cur;
  }else{
    ctl=document.createElement('input');
    ctl.type=col.type==='date'?'date':'text';
    ctl.value=ch!=null?ch:cur;
  }
  ctl.className='tr-ed';
  td.classList.add('ed');td.innerHTML='';td.appendChild(ctl);
  ctl.focus();
  if(ctl.tagName==='INPUT'&&ctl.type==='text'){if(ch==null)ctl.select();else ctl.setSelectionRange(ctl.value.length,ctl.value.length)}
  TU.edit={r,c};
  const finish=(commit,dr,dc)=>{
    if(!TU.edit)return;
    TU.edit=null;TU.fin=null;
    if(commit&&tSetVal(row,col,ctl.value))tSave();
    TU.a={r:Math.max(0,r+(dr||0)),c:Math.max(0,Math.min(V.list.cols.length-1,c+(dc||0)))};TU.b=null;
    tRenderAll();
    $('#trGrid').focus({preventScroll:true});
  };
  TU.fin=finish;
  ctl.addEventListener('keydown',ev=>{
    ev.stopPropagation();
    if(ev.key==='Enter'){ev.preventDefault();finish(true,1,0)}
    else if(ev.key==='Tab'){ev.preventDefault();finish(true,0,ev.shiftKey?-1:1)}
    else if(ev.key==='Escape'){ev.preventDefault();finish(false,0,0)}
  });
  ctl.addEventListener('blur',()=>finish(true,0,0));
  if(ctl.tagName==='SELECT')ctl.addEventListener('change',()=>finish(true,0,0));
}
function tClearRange(){
  const V=TU.view,sel=tSel(),u=tMe();if(!V||!sel)return;
  let n=0,skip=0;
  for(let r=sel.r0;r<=sel.r1;r++)for(let c=sel.c0;c<=sel.c1;c++){
    const row=V.rows[r],col=V.list.cols[c];if(!row||!col)continue;
    if(!tCanEdit(u,row,col)){skip++;continue}
    if(tSetVal(row,col,''))n++;
  }
  if(n)tSave();
  tMsg(`Tömde ${n} celler${skip?`, ${skip} hoppades över (saknar behörighet)`:''}.`);
  tRenderAll();
}
function tCopy(){
  const V=TU.view,sel=tSel();if(!V||!sel)return null;
  const lines=[];
  for(let r=sel.r0;r<=sel.r1;r++){const row=V.rows[r];if(!row)continue;const cells=[];for(let c=sel.c0;c<=sel.c1;c++)cells.push(tText(row,V.list.cols[c]).replace(/[\t\r\n]+/g,' '));lines.push(cells.join('\t'))}
  return lines.join('\n');
}
function tPaste(txt){
  const V=TU.view,u=tMe(),list=V.list,a=TU.a||{r:0,c:0};
  const lines=txt.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(l=>l.split('\t'));
  let n=0,made=0,skip=0;
  lines.forEach((cells,i)=>{
    let row=V.rows[a.r+i];
    if(!row){
      if(!tCan(u,'create')){skip+=cells.length;return}
      row=tNewRow(list,u);V.rows.push(row);made++;
    }
    cells.forEach((val,j)=>{
      const col=list.cols[a.c+j];if(!col)return;
      if(!tCanEdit(u,row,col)){skip++;return}
      const pv=tParse(col,val);
      if(pv==null){skip++;return}
      if(tSetVal(row,col,pv))n++;
    });
  });
  tSave();tRenderAll();
  tMsg(`Klistrade in ${n} värden${made?` och skapade ${made} nya rader`:''}${skip?`. ${skip} värden hoppades över: saknar behörighet eller okänt värde`:''}.`);
}
function tMove(dr,dc,ext){
  const V=TU.view;if(!V)return;
  const nr=V.rows.length,nc=V.list.cols.length;if(!nr)return;
  if(!TU.a)TU.a={r:0,c:0};
  const cur=(ext&&TU.b)||TU.a;
  const nxt={r:clamp(cur.r+dr,0,nr-1),c:clamp(cur.c+dc,0,nc-1)};
  if(ext)TU.b=nxt;else{TU.a=nxt;TU.b=null}
  if(TU.panel&&!ext){const row=V.rows[nxt.r];if(row)TU.rowId=row.id}
  tRenderGrid();
  if(TU.panel)tRenderDetail();
  const td=$('#trGrid').querySelector(`td[data-r="${nxt.r}"][data-c="${nxt.c}"]`);
  if(td)td.scrollIntoView({block:'nearest',inline:'nearest'});
}

/* ----- Detaljpanel ----- */
function tTrans(row,u){
  const lastFix=T.events.slice().reverse().find(e=>e.rowId===row.id&&e.kind==='status'&&e.to==='fixed');
  return T.profile.transitions.filter(t=>t.from===row.status).map(t=>{
    let ok=tCan(u,t.act,row),why='';
    if(ok&&t.fourEyes&&lastFix&&lastFix.user===u.id){ok=false;why='Du åtgärdade punkten själv. En annan person måste godkänna den.'}
    return {t,ok,why};
  });
}
function tEvHTML(e){
  const u=tUser(e.user),who=`<b>${esc(u.name)}</b> <span class="muted">(${T_ROLES[u.role]})</span>`;
  const when=`<div class="m">${tTs(e.ts)}</div>`;
  if(e.kind==='create')return `<li>${who} skapade punkten${when}</li>`;
  if(e.kind==='field')return `<li>${who} ändrade <b>${esc(e.field)}</b> från ”${esc(e.from||'tomt')}” till ”${esc(e.to||'tomt')}”${when}</li>`;
  if(e.kind==='status')return `<li class="s">${who} ändrade status från <b>${esc(tStat(e.from).name)}</b> till <b>${esc(tStat(e.to).name)}</b>${e.text?`<blockquote>${esc(e.text)}</blockquote>`:''}${when}</li>`;
  if(e.kind==='comment')return `<li class="c">${who} kommenterade<blockquote>${esc(e.text)}</blockquote>${when}</li>`;
  if(e.kind==='attach')return `<li>${who} bifogade <b>${esc(e.text)}</b>${when}</li>`;
  return '';
}
function tFieldCtl(row,col,u){
  const val=row.v[col.key]==null?'':row.v[col.key],can=tCanEdit(u,row,col);
  if(!can)return `<div class="v">${esc(tText(row,col))||'<span class="muted">–</span>'}</div>`;
  if(col.type==='select')return `<select data-f="${col.key}"><option value=""></option>${col.opts.map(o=>`<option${o===val?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if(col.type==='part')return `<select data-f="${col.key}"><option value=""></option>${T.parts.filter(p=>p.id!=='pl').map(p=>`<option value="${p.id}"${p.id===val?' selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
  if(col.type==='person')return `<select data-f="${col.key}"><option value=""></option>${T.users.filter(x=>x.part===row.v.part).map(x=>`<option value="${x.id}"${x.id===val?' selected':''}>${esc(x.name)}</option>`).join('')}</select>`;
  if(col.type==='date')return `<input type="date" data-f="${col.key}" value="${esc(val)}">`;
  if(col.type==='long')return `<textarea data-f="${col.key}">${esc(val)}</textarea>`;
  return `<input type="text" data-f="${col.key}" value="${esc(val)}">`;
}

  if(!row||tVis(list,tMe()).indexOf(row)<0){el.hidden=true;main.classList.remove('has-d');return}

  else if(!okTr.length&&row.status!=='closed')h+=`<div class="td-hint">${T_ROLES[u.role]} har inga åtgärder på den här punkten just nu.</div>`;

  if(TU.ptab==='comments'){

    h+=cs.length?`<ul class="td-ev">${cs.map(tEvHTML).join('')}</ul>`:`<div class="td-hint">Inga kommentarer än.</div>`;
    if(tCan(u,'comment',row))h+=`<div class="td-cbox"><textarea id="trCom" aria-label="Ny kommentar" placeholder="Skriv en kommentar"></textarea><button class="btn sm primary" data-d="addc">Kommentera</button></div>`;
  }else if(TU.ptab==='hist'){
    h+=`<ul class="td-ev">${evs.slice().reverse().map(tEvHTML).join('')}</ul>`;
  }else{
    h+=row.att.length?`<ul class="td-ev">${row.att.map(a=>`<li><b>${esc(a.name)}</b> <span class="muted">${esc(a.size||'')}</span><div class="m">${esc(tUser(a.by).name)}, ${tTs(a.ts)}</div></li>`).join('')}</ul>`:`<div class="td-hint">Inga bilagor.</div>`;
    if(tCan(u,'comment',row))h+=`<div class="td-cbox"><input type="file" id="trFile" aria-label="Lägg till bilaga"><div class="td-hint">I prototypen sparas bara filens namn och storlek, inte innehållet.</div></div>`;
  }
  el.innerHTML=h;el.hidden=false;main.classList.add('has-d');
}
function tDoTrans(row,t,comment){

    const b=e.target.closest('[data-m]');if(!b)return;
    const a=b.dataset.m;
    if(a==='close')tCloseModal();
    else if(a==='reset1'){TU.confirmReset=true;modal.innerHTML=`<div class="tr-box">${tModalHTML()}</div>`}
    else if(a==='reset0'){TU.confirmReset=false;modal.innerHTML=`<div class="tr-box">${tModalHTML()}</div>`}
    else if(a==='reset2'){const me=T.me;T=tMake();T.me=me;tSave();TU.panel=false;TU.a=null;TU.b=null;tCloseModal();renderTrace();tMsg('Exempeldatan är återställd.')}
    else if(a==='xlexp'){
      const msg=$('#trXlMsg');
      try{const r=tExportXlsx($('#trXlHist').checked);msg.textContent='Skapade '+r.name+' ('+r.rows+' rader, '+r.sheets.length+' flikar). Hittar du den inte i Hämtade filer kan webbläsaren ha blockerat nedladdningen.'}
      catch(err){msg.textContent='Det gick inte att skapa filen: '+err.message}
    }
    else if(a==='copy'){
      const ta=$('#trJsonOut'),msg=$('#trCopyMsg');
      ta.focus();ta.select();
      let p;try{p=navigator.clipboard.writeText(ta.value)}catch(err){p=Promise.reject(err)}
      Promise.resolve(p).then(()=>{msg.textContent='Kopierad.'}).catch(()=>{msg.textContent='Markera texten och kopiera själv.'});
    }
    else if(a==='import'){
      const msg=$('#trImpMsg'),txt=$('#trJsonIn').value.trim();
      try{
        const o=JSON.parse(txt);
        if(!o||!Array.isArray(o.lists)||!Array.isArray(o.users)||!o.profile||!o.perms||!Array.isArray(o.events)||!Array.isArray(o.parts))throw new Error('format');
        if(!o.lists.every(l=>l&&Array.isArray(l.cols)&&Array.isArray(l.rows)))throw new Error('format');
        T=o;if(!T.settings)T.settings={vis:'own'};if(!T.users.some(u=>u.id===T.me))T.me=T.users[0].id;
        tSave();TU.list=null;TU.panel=false;TU.a=null;TU.b=null;tCloseModal();renderTrace();tMsg('Projektet är inläst.');
      }catch(err){msg.textContent='Texten är inte ett giltigt projekt. Kontrollera att hela JSON-texten är med.'}
    }
  });
  modal.addEventListener('change',e=>{
    const p=e.target.closest('[data-perm]');
    if(p){const [a,r]=p.dataset.perm.split('|');T.perms[a][r]=p.value;tSave();tRenderTools();tRenderAll();return}
    if(e.target.matches('[data-vis]')){T.settings.vis=e.target.value;tSave();tRenderAll();return}
    const n=e.target.closest('[data-stn]');
    if(n){const s=T.profile.statuses.find(x=>x.id===n.dataset.stn);if(s&&n.value.trim()){s.name=n.value.trim();tSave();tRenderTools();tRenderAll()}return}
    const c=e.target.closest('[data-stc]');
    if(c){const s=T.profile.statuses.find(x=>x.id===c.dataset.stc);if(s){s.color=c.value;tSave();tRenderAll()}}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&TU.modal&&UI.view==='trace')tCloseModal()});
})();

function setView(v){
  if(v==='plan'&&!isPL())v='net';
  UI.view=v;
  $('#viewNet').hidden=v!=='net';
  $('#viewPlan').hidden=v!=='plan';
  $('#viewCheck').hidden=v!=='check';
  $('#viewTrace').hidden=v!=='trace';
  $('#tabTrace').setAttribute('aria-selected',v==='trace');
  document.body.dataset.view=v;
  $('#tabCheck').setAttribute('aria-selected',v==='check');
  $('#tabNet').setAttribute('aria-selected',v==='net');
  $('#tabPlan').setAttribute('aria-selected',v==='plan');
  if(v==='plan'){
    renderPlan();renderEditor();
    const sc=$('#gScroll');if(sc)sc.scrollLeft=Math.max(0,todayOff()*UI.px-160);
  }else if(v==='check'){renderCheck()}
  else if(v==='trace'){renderTrace()}
  else{renderNet();renderInspector();if(VB.needFit)fitView()}
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('#projName').addEventListener('input',e=>{if(isPL()){P.name=e.target.value;save()}});
$('#asSel').addEventListener('change',e=>{
  UI.as=e.target.value;UI.aiOut=null;UI.aiNote='';UI.adding=null;UI.selLink=null;
  ensureSel();
  if(UI.tab==='log'&&UI.sel&&!sub(UI.sel)&&!canEditArea(UI.sel))UI.tab='folders';
  renderChrome();
  if(UI.view==='plan'&&!isPL())setView('net');else if(UI.view==='check')renderCheck();else{renderNet();renderInspector()}
});
$('#btnCollapse').addEventListener('click',()=>{UI.expanded={};const sb=UI.sel?sub(UI.sel):null;if(sb)UI.sel=sb.parent;UI.shareDrag=null;UI.netMsg='';renderNet();renderInspector();fitView()});
$('#zIn').addEventListener('click',()=>zoomAt(1.3));
$('#zOut').addEventListener('click',()=>zoomAt(1/1.3));
$('#zFit').addEventListener('click',fitView);
$('#btnTidy').addEventListener('click',tidyAreas);
window.addEventListener('resize',()=>{if(UI.view==='net'&&!VB.user)fitView()});
$('#btnExample').addEventListener('click',()=>{
  P=makeExample();resetUI();save();renderChrome();setView('net');
});
const sheet=$('#newSheet');
function branchHint(){const b=BR[$('#npBranch').value]||BR.bygg;$('#npHint').textContent='Areor: '+Object.values(b.types).join(', ')+'.'}
(function(){
  $('#npBranch').innerHTML=Object.keys(BR).map(k=>`<option value="${k}">${esc(BR[k].label)}</option>`).join('');
  $('#npBranch').addEventListener('change',branchHint);branchHint();
})();
function openSheet(){
  $('#npStart').value=isoStr(monday(addDays(new Date(),7)));$('#npName').value='';
  sheet.hidden=false;$('#npName').focus();
}
$('#btnNew').addEventListener('click',openSheet);
$('#npCancel').addEventListener('click',()=>{sheet.hidden=true});
sheet.addEventListener('keydown',e=>{if(e.key==='Escape')sheet.hidden=true});
$('#newForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('#npName').value.trim(),st=$('#npStart').value;
  if(!name||!st)return;
  P=makeBlank(name,isoStr(monday(parseD(st))),$('#npBranch').value||'bygg',$('#npTpl').checked);
  resetUI();sheet.hidden=true;save();renderChrome();setView('net');
});

renderChrome();
setView('net');
})();
</script>

</body></html>
